name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build MCP server
        run: npm run build
      - name: Run unit test suite
        run: npm test
      - name: Verify zero author identity leak
        run: |
          AUTHOR=$(git log -1 --pretty=format:'%ae')
          echo "Commit author email: $AUTHOR"
          if [[ "$AUTHOR" != *"@franchisedata.io"* && "$AUTHOR" != *"users.noreply.github.com"* ]]; then
            echo "Error: Commit author email '$AUTHOR' does not match organization domain."
            exit 1
          fi
